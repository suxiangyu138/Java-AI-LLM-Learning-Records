<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font-display: 'JetBrains Mono', monospace;
    --font-body: 'Noto Sans SC', sans-serif;
    --color-bg: #0d0f14;
    --color-surface: #151820;
    --color-surface-2: #1c2030;
    --color-border: rgba(255,255,255,0.08);
    --color-text: #e2e6f0;
    --color-text-muted: #7a8399;
    --color-primary: #3dffa0;
    --color-primary-dim: rgba(61,255,160,0.15);
    --color-secondary: #5b8cff;
    --color-danger: #ff4d6d;
    --color-warning: #ffbe4d;
    --color-food: #ff6b6b;
    --radius-sm: 4px; --radius-md: 8px; --radius-lg: 16px;
    --space-1:4px;--space-2:8px;--space-3:12px;
    --space-4:16px;--space-6:24px;--space-8:32px;
    --transition: 200ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html, body {
    width:100%; height:100%;
    background:var(--color-bg);
    color:var(--color-text);
    font-family:var(--font-body);
    overflow:hidden; user-select:none;
  }
  #app {
    width:100vw; height:100dvh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:var(--space-4); padding:var(--space-4);
  }
  #hud {
    display:flex; align-items:center; gap:var(--space-6);
    background:var(--color-surface);
    border:1px solid var(--color-border);
    border-radius:var(--radius-lg);
    padding:var(--space-3) var(--space-6);
    width:100%; max-width:600px;
  }
  .hud-item { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .hud-label { font-size:11px; color:var(--color-text-muted); text-transform:uppercase; letter-spacing:1px; font-family:var(--font-display); }
  .hud-value {
    font-family:var(--font-display); font-size:22px; font-weight:700;
    font-variant-numeric:tabular-nums lining-nums;
    color:var(--color-primary); transition:transform 0.1s; min-width:3ch; text-align:center;
  }
  .hud-value.bump { animation:bump 0.15s ease-out; }
  .hud-sep { width:1px; height:32px; background:var(--color-border); flex-shrink:0; }
  .level-bar-wrap { flex:1; display:flex; flex-direction:column; gap:4px; min-width:80px; }
  .level-bar-track { height:4px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; }
  .level-bar-fill { height:100%; background:var(--color-primary); border-radius:2px; transition:width 0.4s var(--transition); }
  #canvas-wrap {
    position:relative; border-radius:var(--radius-lg); overflow:hidden;
    box-shadow:0 0 40px rgba(61,255,160,0.08), 0 0 0 1px var(--color-border);
  }
  canvas { display:block; }
  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:var(--space-6);
    background:rgba(13,15,20,0.88); backdrop-filter:blur(8px);
    border-radius:var(--radius-lg); padding:var(--space-8); transition:opacity 0.3s;
  }
  .overlay.hidden { opacity:0; pointer-events:none; }
  .overlay-title {
    font-family:var(--font-display); font-size:clamp(1.8rem,4vw,2.8rem); font-weight:700;
    color:var(--color-primary); text-align:center; line-height:1.1;
    text-shadow:0 0 30px rgba(61,255,160,0.4);
  }
  .overlay-sub { font-size:14px; color:var(--color-text-muted); text-align:center; max-width:300px; line-height:1.6; }
  .overlay-score { font-family:var(--font-display); font-size:48px; font-weight:700; color:var(--color-text); font-variant-numeric:tabular-nums; text-align:center; }
  .overlay-score span { color:var(--color-primary); }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2);
    font-family:var(--font-display); font-size:14px; font-weight:600;
    border:none; border-radius:var(--radius-md); padding:var(--space-3) var(--space-6);
    cursor:pointer; transition:all var(--transition); min-width:140px;
  }
  .btn-primary { background:var(--color-primary); color:#0d0f14; }
  .btn-primary:hover { background:#5dffc0; transform:translateY(-1px); box-shadow:0 4px 20px rgba(61,255,160,0.3); }
  .btn-primary:active { transform:translateY(0); }
  .btn-ghost { background:transparent; color:var(--color-text-muted); border:1px solid var(--color-border); }
  .btn-ghost:hover { color:var(--color-text); border-color:rgba(255,255,255,0.2); }
  .key-hint { display:flex; align-items:center; gap:var(--space-2); font-size:12px; color:var(--color-text-muted); font-family:var(--font-display); flex-wrap:wrap; justify-content:center; }
  .key { background:var(--color-surface-2); border:1px solid var(--color-border); border-radius:var(--radius-sm); padding:2px 6px; font-size:11px; color:var(--color-text); }
  #mobile-controls { display:none; grid-template-columns:repeat(3,52px); grid-template-rows:repeat(2,52px); gap:var(--space-2); margin-top:var(--space-2); }
  @media (max-width:600px),(pointer:coarse) { #mobile-controls { display:grid; } }
  .dpad-btn {
    display:flex; align-items:center; justify-content:center;
    background:var(--color-surface-2); border:1px solid var(--color-border);
    border-radius:var(--radius-md); color:var(--color-text); font-size:18px;
    cursor:pointer; transition:all var(--transition); touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .dpad-btn:active { background:var(--color-primary-dim); border-color:var(--color-primary); color:var(--color-primary); transform:scale(0.92); }
  .dpad-up{grid-column:2;grid-row:1} .dpad-left{grid-column:1;grid-row:2}
  .dpad-down{grid-column:2;grid-row:2} .dpad-right{grid-column:3;grid-row:2}
  @keyframes bump { 0%{transform:scale(1)} 50%{transform:scale(1.25);color:var(--color-warning)} 100%{transform:scale(1)} }
  @keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  .overlay > * { animation:slideUp 0.3s var(--transition) both; }
  .overlay > *:nth-child(2){animation-delay:.05s} .overlay > *:nth-child(3){animation-delay:.1s}
  .overlay > *:nth-child(4){animation-delay:.15s} .overlay > *:nth-child(5){animation-delay:.2s}
  #particles { position:absolute; inset:0; pointer-events:none; border-radius:var(--radius-lg); overflow:hidden; }
  .particle { position:absolute; border-radius:50%; pointer-events:none; animation:particleFly var(--dur,.8s) var(--ease,ease-out) forwards; }
  @keyframes particleFly { 0%{opacity:1;transform:translate(0,0) scale(1)} 100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)} }
  #fps-debug { position:absolute; top:6px; right:8px; font:10px/1.4 monospace; color:rgba(61,255,160,0.5); pointer-events:none; z-index:10; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-item">
      <span class="hud-label">得分</span>
      <span class="hud-value" id="score-display">0</span>
    </div>
    <div class="hud-sep"></div>
    <div class="hud-item">
      <span class="hud-label">最高分</span>
      <span class="hud-value" id="best-display" style="color:var(--color-secondary)">0</span>
    </div>
    <div class="hud-sep"></div>
    <div class="hud-item level-bar-wrap">
      <div style="display:flex;justify-content:space-between;width:100%">
        <span class="hud-label">等级 <span id="level-display" style="color:var(--color-primary)">1</span></span>
        <span class="hud-label" id="speed-display">普通</span>
      </div>
      <div class="level-bar-track"><div class="level-bar-fill" id="level-bar" style="width:0%"></div></div>
    </div>
    <div class="hud-sep"></div>
    <div class="hud-item">
      <span class="hud-label">长度</span>
      <span class="hud-value" id="len-display" style="color:var(--color-text-muted)">1</span>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="gameCanvas"></canvas>
    <div id="particles"></div>
    <div id="fps-debug"></div>
    <div class="overlay" id="startScreen">
      <div class="overlay-title">🐍 贪吃蛇</div>
      <div class="overlay-sub">操控蛇吃食物成长，避免撞墙或咬到自己！<br>吃到 ⭐ 金星可获得额外积分</div>
      <button class="btn btn-primary" id="startBtn">开始游戏</button>
      <div class="key-hint"><span class="key">W A S D</span> 或 <span class="key">↑ ← ↓ →</span> 控制方向 &nbsp;·&nbsp; <span class="key">P</span> 暂停</div>
    </div>
    <div class="overlay hidden" id="pauseScreen">
      <div class="overlay-title">⏸ 已暂停</div>
      <button class="btn btn-primary" id="resumeBtn">继续游戏</button>
      <button class="btn btn-ghost" id="restartFromPause">重新开始</button>
      <div class="key-hint"><span class="key">P</span> 继续 &nbsp;·&nbsp; <span class="key">R</span> 重新开始</div>
    </div>
    <div class="overlay hidden" id="gameOverScreen">
      <div class="overlay-title">💀 游戏结束</div>
      <div id="final-score-wrap" class="overlay-score"></div>
      <button class="btn btn-primary" id="restartBtn">再来一次</button>
      <div class="key-hint"><span class="key">R</span> 快速重开</div>
    </div>
  </div>

  <div id="mobile-controls">
    <button class="dpad-btn dpad-up"    data-dir="UP">↑</button>
    <button class="dpad-btn dpad-left"  data-dir="LEFT">←</button>
    <button class="dpad-btn dpad-down"  data-dir="DOWN">↓</button>
    <button class="dpad-btn dpad-right" data-dir="RIGHT">→</button>
  </div>
</div>

<script>
const GRID=20, BASE_SPEED=130, SPEED_SCALE=0.88, LEVEL_EVERY=5;
const BONUS_CHANCE=0.35, BONUS_DURATION=6000;
const LEVELS=['慢速','普通','快速','极快','疯狂'];
const canvas=document.getElementById('gameCanvas'), ctx=canvas.getContext('2d'), wrap=document.getElementById('canvas-wrap');
let COLS,ROWS,TILE;

function sizeCanvas(){
  const vw=Math.min(window.innerWidth-32,600), vh=Math.min(window.innerHeight-170,560);
  TILE=Math.max(14,Math.floor(Math.min(vw,vh)/GRID));
  COLS=Math.floor(vw/TILE); ROWS=Math.floor(vh/TILE);
  canvas.width=COLS*TILE; canvas.height=ROWS*TILE;
  wrap.style.width=canvas.width+'px'; wrap.style.height=canvas.height+'px';
}
sizeCanvas();
window.addEventListener('resize',()=>{sizeCanvas();if(state.phase==='playing'||state.phase==='paused')render();});

const DIR={UP:[0,-1],DOWN:[0,1],LEFT:[-1,0],RIGHT:[1,0]};
const OPPOSITE={UP:'DOWN',DOWN:'UP',LEFT:'RIGHT',RIGHT:'LEFT'};
let state,tickTimer,bestScore=0;

function initState(){
  const cx=Math.floor(COLS/2),cy=Math.floor(ROWS/2);
  return{phase:'idle',snake:[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}],dir:'RIGHT',nextDir:'RIGHT',food:null,bonus:null,bonusExpire:0,score:0,level:1,tick:0};
}
state=initState();

function randomCell(exclude=[]){
  let x,y,tries=0;
  do{x=Math.floor(Math.random()*COLS);y=Math.floor(Math.random()*ROWS);tries++; if(tries>2000)return null;}
  while(exclude.some(c=>c.x===x&&c.y===y));
  return{x,y};
}
function spawnFood(){ state.food=randomCell(state.snake); }
function spawnBonus(){
  if(Math.random()<BONUS_CHANCE){
    const pos=randomCell([...state.snake,state.food]);
    if(pos){const v=[3,5,8][Math.floor(Math.random()*3)]; state.bonus={...pos,value:v}; state.bonusExpire=performance.now()+BONUS_DURATION;}
  }
}

function tick(){
  if(state.phase!=='playing')return;
  state.dir=state.nextDir;
  const d=DIR[state.dir],head=state.snake[0];
  const nx=head.x+d[0],ny=head.y+d[1];
  if(nx<0||nx>=COLS||ny<0||ny>=ROWS){die();return;}
  for(let i=0;i<state.snake.length-1;i++){if(state.snake[i].x===nx&&state.snake[i].y===ny){die();return;}}
  state.snake.unshift({x:nx,y:ny});
  let grew=false;
  if(state.food&&nx===state.food.x&&ny===state.food.y){grew=true;state.score+=1;emitParticles(nx*TILE+TILE/2,ny*TILE+TILE/2,'#ff6b6b',10);spawnFood();spawnBonus();bumpHud('score-display');}
  if(state.bonus&&nx===state.bonus.x&&ny===state.bonus.y){grew=true;state.score+=state.bonus.value;emitParticles(nx*TILE+TILE/2,ny*TILE+TILE/2,'#ffd700',16);state.bonus=null;bumpHud('score-display');}
  if(state.bonus&&performance.now()>state.bonusExpire)state.bonus=null;
  if(!grew)state.snake.pop();
  const newLevel=Math.floor(state.score/LEVEL_EVERY)+1;
  if(newLevel!==state.level){state.level=newLevel;clearInterval(tickTimer);scheduleTickTimer();}
  if(state.score>bestScore){bestScore=state.score;document.getElementById('best-display').textContent=bestScore;}
  updateHUD(); render();
}

function die(){
  state.phase='dead'; clearInterval(tickTimer);
  const h=state.snake[0]; emitParticles(h.x*TILE+TILE/2,h.y*TILE+TILE/2,'#ff4d6d',20);
  render(); setTimeout(showGameOver,350);
}
function getSpeed(){return Math.round(BASE_SPEED*Math.pow(SPEED_SCALE,state.level-1));}
function scheduleTickTimer(){tickTimer=setInterval(tick,getSpeed());}

function startGame(){
  clearInterval(tickTimer); state=initState(); state.phase='playing';
  spawnFood(); updateHUD(); render(); scheduleTickTimer();
  hide('startScreen');hide('gameOverScreen');hide('pauseScreen');
}
function pause(){if(state.phase!=='playing')return;state.phase='paused';clearInterval(tickTimer);show('pauseScreen');}
function resume(){if(state.phase!=='paused')return;state.phase='playing';scheduleTickTimer();hide('pauseScreen');}
function showGameOver(){
  const sw=document.getElementById('final-score-wrap'), isNew=state.score>=bestScore&&state.score>0;
  sw.innerHTML=`<div style="font-size:13px;color:var(--color-text-muted);margin-bottom:4px">${isNew?'🎉 新记录！':'本次得分'}</div><div><span style="color:var(--color-primary)">${state.score}</span> 分</div><div style="font-size:14px;margin-top:4px;color:var(--color-text-muted)">长度 ${state.snake.length} · 等级 ${state.level}</div>`;
  show('gameOverScreen');
}

function updateHUD(){
  document.getElementById('score-display').textContent=state.score;
  document.getElementById('level-display').textContent=state.level;
  document.getElementById('len-display').textContent=state.snake.length;
  document.getElementById('level-bar').style.width=((state.score%LEVEL_EVERY)/LEVEL_EVERY*100)+'%';
  document.getElementById('speed-display').textContent=LEVELS[Math.min(state.level-1,LEVELS.length-1)];
}
function bumpHud(id){const el=document.getElementById(id);el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}

let _frames=0,_lastFps=performance.now(),_fps=0;
function render(){
  _frames++;const now=performance.now();
  if(now-_lastFps>1000){_fps=Math.round(_frames*1000/(now-_lastFps));_frames=0;_lastFps=now;document.getElementById('fps-debug').textContent=`${_fps} fps`;}
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0d0f14'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.028)'; ctx.lineWidth=0.5;
  for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*TILE,0);ctx.lineTo(x*TILE,H);ctx.stroke();}
  for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*TILE);ctx.lineTo(W,y*TILE);ctx.stroke();}
  if(state.phase==='idle')return;
  if(state.food){
    const fx=state.food.x*TILE+TILE/2,fy=state.food.y*TILE+TILE/2;
    const pulse=0.85+0.15*Math.sin(Date.now()/600), r=(TILE/2-2)*pulse;
    ctx.save();
    const grd=ctx.createRadialGradient(fx,fy,0,fx,fy,TILE);
    grd.addColorStop(0,'rgba(255,107,107,0.3)'); grd.addColorStop(1,'transparent');
    ctx.fillStyle=grd; ctx.fillRect(state.food.x*TILE-TILE,state.food.y*TILE-TILE,TILE*3,TILE*3);
    ctx.fillStyle='#ff6b6b'; ctx.beginPath(); ctx.arc(fx,fy,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.arc(fx-r*0.2,fy-r*0.25,r*0.35,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  if(state.bonus){
    const bx=state.bonus.x*TILE+TILE/2,by=state.bonus.y*TILE+TILE/2;
    const remaining=(state.bonusExpire-performance.now())/BONUS_DURATION;
    const blink=remaining<0.25?(Math.sin(Date.now()/100)>0?1:0.2):1;
    ctx.save(); ctx.globalAlpha=blink;
    const bgrd=ctx.createRadialGradient(bx,by,0,bx,by,TILE*1.2);
    bgrd.addColorStop(0,'rgba(255,215,0,0.35)'); bgrd.addColorStop(1,'transparent');
    ctx.fillStyle=bgrd; ctx.fillRect(state.bonus.x*TILE-TILE,state.bonus.y*TILE-TILE,TILE*3,TILE*3);
    ctx.font=`bold ${TILE-2}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#ffd700'; ctx.fillText('★',bx,by);
    ctx.restore();
  }
  const len=state.snake.length;
  for(let i=len-1;i>=0;i--){
    const seg=state.snake[i],t=i/len,px=seg.x*TILE,py=seg.y*TILE,pad=state.phase==='dead'?2:(i===0?0.5:1.5);
    const g=Math.round(255*(0.63-t*0.35)),b=Math.round(160*(1-t*0.7));
    ctx.fillStyle=i===0?(state.phase==='dead'?'#ff4d6d':`rgb(61,${g+30},${b+30})`):`rgb(20,${g},${b})`;
    roundRect(ctx,px+pad,py+pad,TILE-pad*2,TILE-pad*2,TILE*0.38); ctx.fill();
    if(i!==0&&TILE>=16){ctx.fillStyle='rgba(255,255,255,0.07)';roundRect(ctx,px+pad,py+pad,TILE-pad*2,(TILE-pad*2)*0.4,TILE*0.38);ctx.fill();}
  }
  if(state.snake.length>0&&state.phase!=='dead')drawEyes(state.snake[0],state.dir);
}

function drawEyes(head,dir){
  const hx=head.x*TILE+TILE/2,hy=head.y*TILE+TILE/2,r=TILE*0.13;
  let e1,e2;
  switch(dir){
    case'RIGHT':e1={x:hx+TILE*0.2,y:hy-TILE*0.2};e2={x:hx+TILE*0.2,y:hy+TILE*0.2};break;
    case'LEFT': e1={x:hx-TILE*0.2,y:hy-TILE*0.2};e2={x:hx-TILE*0.2,y:hy+TILE*0.2};break;
    case'UP':   e1={x:hx-TILE*0.2,y:hy-TILE*0.2};e2={x:hx+TILE*0.2,y:hy-TILE*0.2};break;
    case'DOWN': e1={x:hx-TILE*0.2,y:hy+TILE*0.2};e2={x:hx+TILE*0.2,y:hy+TILE*0.2};break;
  }
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(e1.x,e1.y,r,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(e2.x,e2.y,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0d0f14';
  ctx.beginPath();ctx.arc(e1.x,e1.y,r*0.55,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(e2.x,e2.y,r*0.55,0,Math.PI*2);ctx.fill();
}

function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function emitParticles(x,y,color,count){
  const container=document.getElementById('particles');
  for(let i=0;i<count;i++){
    const el=document.createElement('div'); el.className='particle';
    const angle=(Math.PI*2*i/count)+Math.random()*0.3, speed=20+Math.random()*45;
    const size=3+Math.random()*4, dur=0.4+Math.random()*0.5;
    el.style.cssText=`left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${color};--tx:${Math.cos(angle)*speed}px;--ty:${Math.sin(angle)*speed}px;--dur:${dur}s;`;
    container.appendChild(el); setTimeout(()=>el.remove(),dur*1000+50);
  }
}

const keyMap={ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',KeyW:'UP',KeyS:'DOWN',KeyA:'LEFT',KeyD:'RIGHT'};
document.addEventListener('keydown',e=>{
  const dir=keyMap[e.code];
  if(dir){e.preventDefault();if(state.phase==='playing'&&dir!==OPPOSITE[state.dir])state.nextDir=dir;if(state.phase==='idle')startGame();return;}
  if(e.code==='KeyP'||e.code==='Escape'){if(state.phase==='playing')pause();else if(state.phase==='paused')resume();}
  if(e.code==='KeyR'){if(state.phase==='dead'||state.phase==='paused')startGame();}
  if(e.code==='Space'){e.preventDefault();if(state.phase==='idle'||state.phase==='dead')startGame();else if(state.phase==='playing')pause();else if(state.phase==='paused')resume();}
});

document.querySelectorAll('.dpad-btn').forEach(btn=>{
  const h=e=>{e.preventDefault();const dir=btn.dataset.dir;if(state.phase==='idle'){startGame();return;}if(state.phase==='playing'&&dir!==OPPOSITE[state.dir])state.nextDir=dir;};
  btn.addEventListener('touchstart',h,{passive:false}); btn.addEventListener('mousedown',h);
});

let _ts=null;
canvas.addEventListener('touchstart',e=>{_ts={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(!_ts)return;
  const dx=e.changedTouches[0].clientX-_ts.x,dy=e.changedTouches[0].clientY-_ts.y; _ts=null;
  if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
  let dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'RIGHT':'LEFT'):(dy>0?'DOWN':'UP');
  if(state.phase==='idle'){startGame();return;}
  if(state.phase==='playing'&&dir!==OPPOSITE[state.dir])state.nextDir=dir;
},{passive:true});

function show(id){document.getElementById(id).classList.remove('hidden');}
function hide(id){document.getElementById(id).classList.add('hidden');}
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('resumeBtn').addEventListener('click',resume);
document.getElementById('restartBtn').addEventListener('click',startGame);
document.getElementById('restartFromPause').addEventListener('click',startGame);

requestAnimationFrame(function loop(){if(state.phase==='playing')render();requestAnimationFrame(loop);})();
render();
</script>
</body>
</html>
