# 密钥泄露门禁：扫描完整 Git 历史，覆盖普通提交、PR 与每周定时审计。
# 历史清理完成前，此任务会持续失败并指出旧提交中的泄露，这是预期的阻断行为。

name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks 全历史扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
